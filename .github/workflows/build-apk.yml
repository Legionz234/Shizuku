name: Build APK

# 为什么需要这个 workflow:
#   Shizuku 的官方 Android 工具链（aapt2 / build-tools / NDK）只发布 x86_64 二进制，
#   在 Linux aarch64 主机上无法执行，所以构建放在 GitHub Actions 的 x86_64 runner 上。
#
# 产出的 APK 会作为 artifact 上传，在 Actions 运行页面直接下载安装即可。
# 不需要配置任何 secrets: signing.gradle 在缺少 signing.properties 时会自动回退到
# debug keystore，因此 debug 与 release 变体都能签出可安装的包。

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # .gitmodules 里的 api 子模块用的是 SSH 地址（git@github.com:...），
      # runner 上没有部署密钥。必须在 checkout 之前改写成 HTTPS，否则子模块拉取失败。
      - name: Use HTTPS for submodules
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # versionCode 由 `git rev-list --count HEAD` 计算，浅克隆会让版本号退化
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 只缓存用得到的那个 NDK 版本。
      #
      # 之前缓存的是整个 ndk/ 目录，而 runner 镜像里预装了多个版本，加起来好几个 GB ——
      # 于是每次光恢复就要 43s、保存 25s，占了总时长的三分之一还多。
      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/29.0.13113456
          key: ndk-29.0.13113456-linux-x64-v2

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 用固定密钥签名。
      #
      # 不写这一步的话，signing.gradle 会回退到 runner 上自动生成的调试密钥，
      # 而 runner 每次都是全新环境 —— 于是每个包的签名都不一样，连自己覆盖自己
      # 都装不上（实测 r1092 的指纹是 f7396b4a…、r1093 是 99d341c2…）。
      - name: Write signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KS_ALIAS_PASS: ${{ secrets.KEYSTORE_ALIAS_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::secrets.KEYSTORE 未配置。缺了它构建会回退到随机调试密钥，"
            echo "::error::导致每次构建签名不同、无法覆盖安装已装的版本，因此这里直接失败。"
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > key.jks
          # signing.gradle 读的是仓库根目录的 signing.properties，其中 KEYSTORE_FILE
          # 相对于 manager 模块解析，所以是 ../key.jks
          {
            echo "KEYSTORE_FILE=../key.jks"
            echo "KEYSTORE_PASSWORD=$KS_PASS"
            echo "KEYSTORE_ALIAS=$KS_ALIAS"
            echo "KEYSTORE_ALIAS_PASSWORD=$KS_ALIAS_PASS"
          } > signing.properties

          echo "已写入 key.jks ($(stat -c %s key.jks) 字节) 与 signing.properties"

      - name: Build debug APK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

          # ndkVersion 锁定的是 29.0.13113456，对应 r29-beta1。
          # beta 包属于预览通道，不打开 canary 通道 AGP 会下载失败。
          echo 'android.sdk.channel=3' >> gradle.properties

          # 打开任务级构建缓存与并行：没改动的任务（Kotlin 编译、native 编译、
          # 资源处理）下次直接从 ~/.gradle 的缓存恢复，不再重跑。
          echo 'org.gradle.caching=true' >> gradle.properties
          echo 'org.gradle.parallel=true' >> gradle.properties
          echo 'org.gradle.workers.max=4' >> gradle.properties

          ./gradlew --build-cache :manager:assembleDebug

      # 签名一旦漂移，装过旧版的手机会因为签名冲突装不上新包，而且到用户手里才会发现。
      # 这里让构建自己检查，指纹不对就直接失败。
      - name: Verify signing certificate
        run: |
          EXPECTED="864a73aff8acb80a0586b98d1ea5177c968e4d86307630f2c5037d61e57aacbe"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          APK=$(ls manager/build/outputs/apk/debug/*.apk | head -1)

          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" \
            | grep -m1 'SHA-256 digest' | awk '{print $NF}' | tr -d ':' | tr 'A-Z' 'a-z')

          echo "APK: $APK"
          echo "期望指纹: $EXPECTED"
          echo "实际指纹: $ACTUAL"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::签名证书与期望不一致，这个包装不上已有的版本（签名冲突）"
            exit 1
          fi
          echo "签名一致 ✓"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: shizuku-debug-apk
          path: manager/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
